<mat-toolbar color="primary" class="barra-superior">
  <div class="zona-izquierda">
    <mat-icon>task_alt</mat-icon>
    <span class="marca">Tareas App</span>
  </div>

  <span class="titulo-central">Gestión de Tareas</span>

  <div class="zona-derecha">
    @if (!estaAutenticado) {
      <button mat-flat-button (click)="iniciarSesion()">
        <mat-icon>login</mat-icon>
        Iniciar sesión
      </button>
    } @else {
      <button mat-button [matMenuTriggerFor]="menuUsuario" class="boton-usuario">
        <mat-icon>account_circle</mat-icon>
        {{ nombreUsuario }}
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #menuUsuario="matMenu">
        <button mat-menu-item (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    }
  </div>
</mat-toolbar>

@if (estaAutenticado) {
  <mat-toolbar class="barra-menu">
    <a mat-button routerLink="/tareas" routerLinkActive="enlace-activo">
      <mat-icon>checklist</mat-icon>
      Tareas
    </a>
    <a mat-button routerLink="/usuarios" routerLinkActive="enlace-activo">
      <mat-icon>group</mat-icon>
      Usuarios
    </a>
  </mat-toolbar>
}

<div class="contenedor-principal">
  <router-outlet></router-outlet>
</div>
